services:
  mlflow:
    image: mibici-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mibici-mlflow
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:5000,127.0.0.1:5000,mlflow:5000,host.docker.internal:5000"
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////tmp/mlflow.db
      - --artifacts-destination
      - /tmp/mlruns
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: mibici-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mibici-api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      MIBICI_MOCK_REGISTRY: "${MIBICI_MOCK_REGISTRY:-0}"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
