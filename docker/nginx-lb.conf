# Balanceador round-robin para `docker-compose.scale.yml` (issue #162).
events {}

http {
    upstream api_backend {
        # Docker DNS resuelve `api` a la IP de cada replica.
        # max_fails=0: con el valor por defecto (1 falla -> fuera 10 s), en el
        # pico del escenario C nginx saco a las 2 replicas y devolvio 502
        # durante 10 s aunque la API estaba sana (issue #162).
        server api:8000 max_fails=0;
        keepalive 32;
        # Menor que el keep-alive de uvicorn (5 s): nginx cierra primero y no
        # reutiliza una conexion que la API ya cerro.
        keepalive_timeout 4s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Si una replica corta la conexion, reintentar en la otra.
            # non_idempotent: los POST /predict no modifican estado, es seguro
            proxy_next_upstream error timeout http_502 non_idempotent;
        }
    }
}
