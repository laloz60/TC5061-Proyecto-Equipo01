# Balanceador round-robin para `docker-compose.scale.yml` (issue #162).
events {}

http {
    upstream api_backend {
        # Docker DNS resuelve `api` a la IP de cada replica
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
