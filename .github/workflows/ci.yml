name: CI/CD Pipeline

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0

      - name: Check code formatting
        run: ruff format --check

      - name: Run linter
        run: ruff check

  tests:
    name: Unit Tests (Pytest)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest tests -v

  docker-build:
    name: Docker Build (Buildx Cache)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image with GitHub Actions layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mibici-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max