name: CI/CD Pipeline

on:
  # Solo push a main: el trabajo en ramas se valida con pull_request.
  # Antes tambien disparaba push a feature/fix/chore/docs y cada PR corria
  # dos pipelines identicos (el de push y el de pull_request).
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empuja un commit nuevo a un PR mientras el anterior aun corre, la
# corrida vieja se cancela en lugar de dejar las dos en la cola de runners.
# En main nunca se cancela (cancel-in-progress=false) para no matar un deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0

      - name: Check code formatting
        run: ruff format --check

      - name: Run linter
        run: ruff check

  tests:
    # Matriz de prueba por sistema operativo: el equipo desarrolla en macOS y
    # en Linux corre el despliegue. pyproject.toml fija requires-python ~=3.12,
    # por eso la matriz no varia la version de Python.
    name: Unit Tests (Pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      # Que un sistema operativo falle no cancela al otro: se ven ambos resultados
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        shell: bash
        run: |
          set -o pipefail
          pytest tests -v -rs | tee pytest_output.txt

      - name: Publish pytest summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Pytest (${{ matrix.os }})"
            echo '```'
            tail -n 5 pytest_output.txt 2>/dev/null || echo "pytest no genero salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build (Buildx Cache & GHCR)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image with GitHub Actions layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ghcr.io/laloz60/mibici-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-smoke:
    name: API Smoke Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      MIBICI_MOCK_REGISTRY: "1"
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'http://mlflow:5000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Colocar AQUÍ: justo antes de levantar el stack con Docker Compose
      - name: Prepare SQLite db and artifacts dir for Compose smoke test
        run: |
          mkdir -p mlruns
          touch mlflow.db
          chmod 666 mlflow.db
          chmod 777 mlruns

      - name: Start stack with Docker Compose (--build --wait)
        env:
          MIBICI_MOCK_REGISTRY: "1"
        run: docker compose up -d --build --wait

      - name: Run API smoke tests (scripts/test_api.sh)
        run: |
          output=$(bash scripts/test_api.sh http://localhost:8000)
          echo "$output"
          echo "$output" | grep -q '"status":"healthy"'
          echo "$output" | grep -q '"demanda_predicha_viajes"'
          echo "$output" | grep -q '"riesgo_desabasto_o_saturacion"'
          echo "$output" | grep -q '"cluster_asignado"'
          echo "$output" | grep -q 'HTTP status: 422'

      # 2. Colocar AQUÍ: al final de la limpieza con if: always()
      - name: Collect Compose diagnostics and tear down
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=120 || true
          docker compose down -v
          rm -f mlflow.db

  # Notificacion del resultado: resumen en la pagina del run y anotacion
  # (::notice / ::error) que GitHub muestra en el PR y en la pestana Checks.
  # !cancelled(): si la corrida se cancela (commit nuevo al PR), este job no
  # debe marcar failure por ver a sus dependencias en estado "cancelled".
  notify:
    name: Pipeline Summary (Notificación)
    runs-on: ubuntu-latest
    needs: [quality, tests, docker-build, api-smoke]
    if: always() && !cancelled()
    steps:
      - name: Write run summary and annotation
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.docker-build.result }}
          SMOKE: ${{ needs.api-smoke.result }}
          PUBLISHED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## Resultado del pipeline CI/CD"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| Code Quality (Ruff) | $(icon "$QUALITY") $QUALITY |"
            echo "| Unit Tests (ubuntu + macos) | $(icon "$TESTS") $TESTS |"
            echo "| Docker Build | $(icon "$BUILD") $BUILD |"
            echo "| API Smoke Test (Compose) | $(icon "$SMOKE") $SMOKE |"
            echo ""
            echo "- Evento: \`${{ github.event_name }}\` en \`${{ github.ref_name }}\` (commit \`${GITHUB_SHA::7}\`)"
            if [ "$PUBLISHED" = "true" ]; then
              echo "- Imagen publicada: \`ghcr.io/laloz60/mibici-api:latest\`"
            else
              echo "- Imagen construida sin publicar (solo se publica en push a \`main\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$QUALITY$TESTS$BUILD$SMOKE" = "successsuccesssuccesssuccess" ]; then
            echo "::notice title=CI/CD MiBici::Pipeline exitoso: lint, pruebas (ubuntu + macos), build y smoke test en verde"
          else
            echo "::error title=CI/CD MiBici::Pipeline con fallas: quality=$QUALITY tests=$TESTS build=$BUILD smoke=$SMOKE"
            exit 1
          fi
