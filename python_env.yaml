  - matplotlib==3.11.2
  - mlflow==3.17.0
  - numpy==2.5.4
  - pandas==3.0.6
  - pyarrow==25.0.1
  - python-dotenv==1.2.4
  - requests==2.34.2
  - scikit-learn==1.9.1
  - seaborn==0.13.2
  - tqdm==4.70.1
  - typer==0.27.3
